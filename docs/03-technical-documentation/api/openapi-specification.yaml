components:
  securitySchemes:
    djangoSessionCookie:
      type: apiKey
      in: cookie
      name: sessionid
    djangoCsrfHeader:
      type: apiKey
      in: header
      name: X-CSRFToken
  parameters:
    IdPathParam: { name: id, in: path, required: true, schema: { type: string } }
    UserIdPathParam: { name: userId, in: path, required: true, schema: { type: string } }
    CourseIdPathParam: { name: courseId, in: path, required: true, schema: { type: string } }
    GroupIdPathParam: { name: groupId, in: path, required: true, schema: { type: string } }
    CycleIdPathParam: { name: cycleId, in: path, required: true, schema: { type: string } }
    PageQueryParam: { name: page, in: query, required: false, schema: { type: integer, minimum: 1, default: 1 } }
    PageSizeQueryParam: { name: pageSize, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
  schemas:
    PendingApprovalResponse:
      type: object
      required: [status, approvalRequestId, actionType, requestedByUserId, createdAt, message]
      properties:
        status: { type: string, const: PendingApproval }
        approvalRequestId: { type: string }
        actionType: { type: string }
        requestedByUserId: { type: string }
        createdAt: { type: string, format: date-time }
        message: { type: string }
    StandardErrorResponse:
      type: object
      required: [status, code, message]
      properties:
        status: { type: string, const: ERROR }
        code: { type: string }
        message: { type: string }
        fieldErrors:
          type: object
          additionalProperties: { type: array, items: { type: string } }
    MediaAssetReference:
      type: object
      required: [assetId, url, mimeType, fileName]
      properties:
        assetId: { type: string }
        url: { type: string, format: uri-reference }
        mimeType: { type: string }
        fileName: { type: string }
        sizeBytes: { type: integer, minimum: 0 }
        disposition: { type: string, enum: [inline, attachment] }
  responses:
    AcceptedPendingApproval:
      description: 202 Accepted — Pending Admin Approval (INV-R9)
      content: { application/json: { schema: { $ref: "#/components/schemas/PendingApprovalResponse" } } }
    BadRequestError:
      description: 400 Bad Request
      content: { application/json: { schema: { $ref: "#/components/schemas/StandardErrorResponse" } } }
    UnauthorizedError:
      description: 401 Unauthorized
      content: { application/json: { schema: { $ref: "#/components/schemas/StandardErrorResponse" } } }
    ForbiddenError:
      description: 403 Forbidden
      content: { application/json: { schema: { $ref: "#/components/schemas/StandardErrorResponse" } } }
    NotFoundError:
      description: 404 Not Found (includes INV-R8 Developer masking)
      content: { application/json: { schema: { $ref: "#/components/schemas/StandardErrorResponse" } } }
    ConflictError:
      description: 409 Conflict
      content: { application/json: { schema: { $ref: "#/components/schemas/StandardErrorResponse" } } }
    UnprocessableEntityError:
      description: 422 Unprocessable Entity
      content: { application/json: { schema: { $ref: "#/components/schemas/StandardErrorResponse" } } }

